services:
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:v2
    container_name: silverbullet
    restart: unless-stopped
    environment:
    - SB_USER=admin:admin
    volumes:
      - ./space:/space
    ports:
      - 3000:3000
    networks:
      - productivity-network
      - shared-network

 # Kimai Time Tracking Stack
  kimai-db:
    image: mysql:8.0
    container_name: kimai-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kimai
      MYSQL_USER: kimai
      MYSQL_PASSWORD: kimai_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - ./config/kimai/mysql:/var/lib/mysql
    command: --default-storage-engine=innodb --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - productivity-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  kimai:
    image: kimai/kimai2:apache
    container_name: kimai
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://kimai:kimai_password@kimai-db:3306/kimai?charset=utf8mb4&serverVersion=8.0
      TRUSTED_HOSTS: "^.*$$"
      MAILER_FROM: kimai@go.local
      # Change this to a random string (you can generate one with: openssl rand -hex 32)
      APP_SECRET: 2c89c0135d93e032b07bc26c992c306b5092cd960f40093b53e3dc9334ede832      
      # Admin credentials for first login
      ADMINMAIL: admin@example.com
      ADMINPASS: admin123
    volumes:
      - ./config/kimai/data:/opt/kimai/var
    ports:
      - 8010:8001
    depends_on:
      kimai-db:
        condition: service_healthy
    networks:
      - productivity-network
      - shared-network

  # OpenProject - использует PostgreSQL (свой)
  openproject-db:
    image: postgres:13
    container_name: openproject-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: openproject
      POSTGRES_USER: openproject
      POSTGRES_PASSWORD: openproject_password
    volumes:
      - ./config/openproject/pgdata:/var/lib/postgresql/data
    networks:
      - productivity-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openproject"]
      interval: 10s
      timeout: 5s
      retries: 5

  openproject:
    image: openproject/openproject:15
    container_name: openproject
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://openproject:openproject_password@openproject-db:5432/openproject
      
      SECRET_KEY_BASE: "d65f31dc5469fc3841e73866f341b4c27a8587b619bee6acfd1acaae07ced837"
      
      # Default admin credentials
      OPENPROJECT_ADMIN_EMAIL: admin@example.com
      OPENPROJECT_ADMIN_PASSWORD: admin
      
      # App settings
      OPENPROJECT_HOST__NAME: 10.0.0.16:8020
      OPENPROJECT_HTTPS: 0
      OPENPROJECT_HSTS: 0
      
    volumes:
      - ./config/openproject/assets:/var/openproject/assets
      - ./config/openproject/pgdata-backup:/var/openproject/backup
    ports:
      - 8020:80
    depends_on:
      openproject-db:
        condition: service_healthy
    networks:
      - productivity-network
      - shared-network

networks:
  productivity-network:
    driver: bridge
  shared-network:
    external: true