services:
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:v2
    container_name: silverbullet
    restart: unless-stopped
    environment:
    - SB_USER=admin:admin
    volumes:
      - ./space:/space
    ports:
      - 3000:3000
    networks:
      - productivity-network
      - shared-network

 # Kimai Time Tracking Stack
  kimai-db:
    image: mysql:8.0
    container_name: kimai-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kimai
      MYSQL_USER: kimai
      MYSQL_PASSWORD: kimai_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - ./config/kimai/mysql:/var/lib/mysql
    command: --default-storage-engine=innodb --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - productivity-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  kimai:
    image: kimai/kimai2:apache
    container_name: kimai
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://kimai:kimai_password@kimai-db:3306/kimai?charset=utf8mb4&serverVersion=8.0
      TRUSTED_HOSTS: "^.*$$"
      MAILER_FROM: kimai@go.local
      # Change this to a random string (you can generate one with: openssl rand -hex 32)
      APP_SECRET: 2c89c0135d93e032b07bc26c992c306b5092cd960f40093b53e3dc9334ede832      
      # Admin credentials for first login
      ADMINMAIL: admin@example.com
      ADMINPASS: admin123
    volumes:
      - ./config/kimai/data:/opt/kimai/var
    ports:
      - 8010:8001
    depends_on:
      kimai-db:
        condition: service_healthy
    networks:
      - productivity-network
      - shared-network

  kaneo-postgres:
    image: postgres:16-alpine
    env_file:
      - config/kaneo/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaneo -d kaneo"]
      interval: 10s
      timeout: 5s
      retries: 5

  kaneo-api:
    image: ghcr.io/usekaneo/api:latest
    ports:
      - "1337:1337"
    env_file:
      - config/kaneo/.env
    depends_on:
      kaneo-postgres:
        condition: service_healthy
    restart: unless-stopped

  kaneo-web:
    image: ghcr.io/usekaneo/web:latest
    ports:
      - "5173:5173"
    env_file:
      - config/kaneo/.env
    depends_on:
      - kaneo-api
    restart: unless-stopped

networks:
  productivity-network:
    driver: bridge
  shared-network:
    external: true

volumes:
  postgres_data:
